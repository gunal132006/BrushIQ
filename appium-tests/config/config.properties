# BrushIQ Appium Automation Configuration
appium.server.url=http://127.0.0.1:4723
platform.name=Android
automation.name=UiAutomator2
app.package=com.brushiq
app.activity=.ui.MainActivity
app.path=d:/BrushIQ/android/app/build/outputs/apk/debug/app-debug.apk
device.name=Android Emulator
platform.version=14.0
auto.grant.permissions=true
new.command.timeout=300

# Backend API
api.base.url=https://brushiq-backend.onrender.com/api

# Timeouts & Retries
implicit.wait.seconds=5
explicit.wait.seconds=15
driver.startup.max.retries=3

# Reporting & Paths
reports.path=d:/BrushIQ/appium-tests/reports
screenshots.path=d:/BrushIQ/appium-tests/screenshots
logs.path=d:/BrushIQ/appium-tests/logs
