name: Appium Mobile Automation Workflow

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-mobile-tests:
    name: Run Appium Android Tests
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & UIAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2 || true

      - name: Run Appium Mobile Test Suite
        run: |
          if [ -d "appium-tests" ]; then
            cd appium-tests && npm install && npm test || true
          fi

      - name: Upload Appium Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-test-artifacts
          path: |
            appium-tests/reports/
            appium-summary.xlsx
            appium-test-cases.xlsx
            *.png
