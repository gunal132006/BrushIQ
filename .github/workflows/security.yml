name: BrushIQ — Comprehensive Security Scan

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * 1'   # Every Monday at 03:00 UTC
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

env:
  BACKEND_DIR: backend
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 0. Detect Stack — Auto-detect backend technology
  # ─────────────────────────────────────────────────────────────────────────────
  detect-stack:
    name: 🔍 Detect Backend Stack
    runs-on: ubuntu-latest
    outputs:
      framework: ${{ steps.detect.outputs.framework }}
      language: ${{ steps.detect.outputs.language }}
      has_package_json: ${{ steps.detect.outputs.has_package_json }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect technology stack
        id: detect
        run: |
          FRAMEWORK="unknown"
          LANGUAGE="unknown"
          HAS_PKG="false"

          if [ -f "$BACKEND_DIR/package.json" ]; then
            HAS_PKG="true"
            LANGUAGE="javascript"
            if grep -q '"express"' "$BACKEND_DIR/package.json"; then
              FRAMEWORK="express"
            elif grep -q '"fastify"' "$BACKEND_DIR/package.json"; then
              FRAMEWORK="fastify"
            elif grep -q '"nestjs"' "$BACKEND_DIR/package.json"; then
              FRAMEWORK="nestjs"
            fi
          elif [ -f "pom.xml" ] || [ -f "build.gradle" ]; then
            LANGUAGE="java"
            FRAMEWORK="spring"
          elif [ -f "requirements.txt" ] || [ -f "Pipfile" ]; then
            LANGUAGE="python"
          elif [ -f "go.mod" ]; then
            LANGUAGE="go"
          fi

          echo "framework=$FRAMEWORK"   >> "$GITHUB_OUTPUT"
          echo "language=$LANGUAGE"     >> "$GITHUB_OUTPUT"
          echo "has_package_json=$HAS_PKG" >> "$GITHUB_OUTPUT"

          echo "## Stack Detection Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |"   >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|"              >> "$GITHUB_STEP_SUMMARY"
          echo "| Language  | $LANGUAGE  |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Framework | $FRAMEWORK |" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Gitleaks — Secret / Credential Leakage Detection (Full Git History)
  # ─────────────────────────────────────────────────────────────────────────────
  gitleaks:
    name: 🔑 Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (full history scan)
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: results.sarif
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
          category: gitleaks

      - name: Fail on secret leakage
        if: steps.gitleaks.outcome == 'failure'
        run: |
          echo "::error::🚨 CRITICAL: Gitleaks detected secrets or credentials in the repository!"
          exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Semgrep — SAST (Static Application Security Testing)
  # ─────────────────────────────────────────────────────────────────────────────
  semgrep:
    name: 🧪 Semgrep SAST Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST (Node.js + OWASP + JWT + Secrets)
        run: |
          semgrep ci \
            --config=p/javascript \
            --config=p/nodejs \
            --config=p/jwt \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --config=p/express \
            --config=p/sql-injection \
            --sarif \
            --output=semgrep-results.sarif \
            --json \
            --output-json=semgrep-results.json \
            --severity=ERROR \
            --severity=WARNING \
            --include="backend/src/**" \
            --exclude="node_modules" \
            --exclude="**/*.test.js" \
            --exclude="**/tests/**"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Upload Semgrep SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('semgrep-results.sarif') != ''
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Upload Semgrep JSON report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: |
            semgrep-results.sarif
            semgrep-results.json
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Trivy — Filesystem + Dependency CVE Scanner
  # ─────────────────────────────────────────────────────────────────────────────
  trivy:
    name: 🛡️ Trivy CVE Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan (SARIF for Security tab)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./backend
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: false
          vuln-type: 'os,library'

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Run Trivy JSON report (all severities)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: fs
          scan-ref: ./backend
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: '0'
          ignore-unfixed: false

      - name: Run Trivy table report (human-readable)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: fs
          scan-ref: ./backend
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Check for CRITICAL vulnerabilities and fail
        if: always()
        run: |
          if [ -f trivy-report.json ]; then
            CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-report.json 2>/dev/null || echo 0)
            echo "Critical vulnerabilities found: $CRITICAL_COUNT"
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "::error::🚨 Trivy found $CRITICAL_COUNT CRITICAL vulnerabilities!"
              exit 1
            fi
          fi

      - name: Upload Trivy reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-results.sarif
            trivy-report.json
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. npm Audit — Dependency Vulnerability Review
  # ─────────────────────────────────────────────────────────────────────────────
  npm-audit:
    name: 📦 npm Dependency Audit
    runs-on: ubuntu-latest
    needs: detect-stack
    if: needs.detect-stack.outputs.has_package_json == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json

      - name: Install backend dependencies (clean install)
        run: npm ci --prefix ${{ env.BACKEND_DIR }}

      - name: Run npm audit (fail on HIGH+)
        id: npm_audit
        run: npm audit --audit-level=high --prefix ${{ env.BACKEND_DIR }}
        continue-on-error: true

      - name: Generate npm audit JSON report
        if: always()
        run: npm audit --json --prefix ${{ env.BACKEND_DIR }} > npm-audit-report.json || true

      - name: Parse and summarize audit results
        if: always()
        run: |
          if [ -f npm-audit-report.json ]; then
            CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit-report.json)
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' npm-audit-report.json)
            MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' npm-audit-report.json)
            LOW=$(jq '.metadata.vulnerabilities.low // 0' npm-audit-report.json)

            echo "## npm Audit Results" >> "$GITHUB_STEP_SUMMARY"
            echo "| Severity | Count |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|"            >> "$GITHUB_STEP_SUMMARY"
            echo "| 🔴 Critical | $CRITICAL |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🟠 High     | $HIGH     |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🟡 Moderate | $MODERATE |" >> "$GITHUB_STEP_SUMMARY"
            echo "| 🟢 Low      | $LOW      |" >> "$GITHUB_STEP_SUMMARY"

            if [ "$CRITICAL" -gt 0 ]; then
              echo "::error::🚨 npm audit found $CRITICAL CRITICAL vulnerabilities!"
            fi
          fi

      - name: Upload npm audit report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail on CRITICAL npm audit findings
        if: steps.npm_audit.outcome == 'failure'
        run: |
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit-report.json 2>/dev/null || echo 0)
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::Pipeline fails on CRITICAL npm audit vulnerabilities."
            exit 1
          fi
          echo "::warning::npm audit found high/moderate vulnerabilities — review npm-audit-report artifact."

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. GitHub Dependency Review (PR only)
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-review:
    name: 🔎 Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          comment-summary-in-pr: on-failure

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. Security Hardening Checks — Custom static checks
  # ─────────────────────────────────────────────────────────────────────────────
  hardening-checks:
    name: 🔐 Security Hardening Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for hardcoded secrets patterns
        id: secrets_check
        run: |
          ISSUES=0
          echo "## Hardening Check Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Check for DEFAULT_SECRET fallback in jwt.js
          if grep -r "DEFAULT_SECRET\s*=" backend/src/ --include="*.js" -l; then
            echo "::warning::⚠️  Hardcoded JWT secret fallback detected in jwt config"
            echo "- ⚠️ Hardcoded JWT fallback secret found in jwt.js" >> "$GITHUB_STEP_SUMMARY"
            ISSUES=$((ISSUES+1))
          fi

          # Check for rejectUnauthorized: false
          if grep -r "rejectUnauthorized.*false" backend/src/ --include="*.js" -l; then
            echo "::warning::⚠️  SSL certificate validation disabled (rejectUnauthorized: false)"
            echo "- ⚠️ SSL rejectUnauthorized: false detected" >> "$GITHUB_STEP_SUMMARY"
            ISSUES=$((ISSUES+1))
          fi

          # Check for hardcoded passwords/secrets in .js files
          if grep -rE "(password|secret|key)\s*=\s*['\"][^'\"]{6,}['\"]" backend/src/ --include="*.js" \
             | grep -v "process.env" | grep -v "//.*" | grep -v "\.test\." | head -5; then
            echo "::warning::⚠️  Potential hardcoded credentials found"
            echo "- ⚠️ Potential hardcoded credentials in source code" >> "$GITHUB_STEP_SUMMARY"
            ISSUES=$((ISSUES+1))
          fi

          # Check for unsafe-inline in CSP
          if grep -r "unsafe-inline" backend/src/ --include="*.js" -l; then
            echo "::warning::⚠️  CSP unsafe-inline detected"
            echo "- ⚠️ CSP unsafe-inline found in app.js" >> "$GITHUB_STEP_SUMMARY"
            ISSUES=$((ISSUES+1))
          fi

          # Check for missing body size limits
          if ! grep -r "limit.*[0-9]kb\|limit.*[0-9]mb" backend/src/ --include="*.js" -i -l; then
            echo "::warning::⚠️  No request body size limit detected"
            echo "- ⚠️ express.json() missing size limit" >> "$GITHUB_STEP_SUMMARY"
            ISSUES=$((ISSUES+1))
          fi

          # Check for console.log with potential PII
          PII_LOGS=$(grep -rn "console.log.*email\|console.log.*password\|console.log.*token" \
                     backend/src/ --include="*.js" | wc -l)
          if [ "$PII_LOGS" -gt 0 ]; then
            echo "::warning::⚠️  $PII_LOGS potential PII console.log statements found"
            echo "- ⚠️ $PII_LOGS potential PII exposures in console.log" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total hardening issues found: $ISSUES**" >> "$GITHUB_STEP_SUMMARY"

          if [ "$ISSUES" -gt 5 ]; then
            echo "::warning::Multiple hardening issues detected. Review security-review.md for details."
          fi

      - name: Check .env files not committed
        run: |
          # Check if any .env files with real content exist in tracked files
          if git ls-files | grep -E "^backend/\.env$|^\.env$" | grep -v ".env.example"; then
            echo "::error::🚨 CRITICAL: .env file is tracked by git! Remove it immediately with git rm --cached"
            exit 1
          fi
          echo "✅ No .env files detected in git tracking"

      - name: Verify security headers configured
        run: |
          if grep -q "helmet" backend/src/app.js; then
            echo "✅ Helmet security headers: configured"
          else
            echo "::error::Helmet middleware not found in app.js"
            exit 1
          fi

          if grep -q "express-rate-limit\|rate-limit\|rateLimit" backend/src/app.js backend/src/middlewares/rateLimiter.js 2>/dev/null; then
            echo "✅ Rate limiting: configured"
          else
            echo "::warning::Rate limiting configuration not detected"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # 7. Comprehensive GitHub Actions Security Summary
  # ─────────────────────────────────────────────────────────────────────────────
  security-summary:
    name: 📊 Publish Security Summary
    runs-on: ubuntu-latest
    needs: [detect-stack, gitleaks, semgrep, npm-audit, trivy, hardening-checks]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all security artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-artifacts
        continue-on-error: true

      - name: Write comprehensive security summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'SUMMARY'
          # 🔐 BrushIQ Security Scan — Full Report

          ## Pipeline Overview

          | Tool | Purpose | Status |
          |------|---------|--------|
          SUMMARY

          echo "| 🔍 Stack Detection  | Identify backend technology | ${{ needs.detect-stack.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔑 Gitleaks         | Secret & credential leakage  | ${{ needs.gitleaks.result }}   |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🧪 Semgrep SAST     | OWASP Top 10, JWT, Node.js   | ${{ needs.semgrep.result }}    |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 📦 npm audit        | Dependency CVE check         | ${{ needs.npm-audit.result }}  |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🛡️ Trivy            | Filesystem & library CVEs    | ${{ needs.trivy.result }}      |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔐 Hardening Checks | Config & code hygiene        | ${{ needs.hardening-checks.result }} |" >> "$GITHUB_STEP_SUMMARY"

          cat >> "$GITHUB_STEP_SUMMARY" << 'DETAILS'

          ---

          ## Detected Stack

          - **Language:** Node.js / JavaScript
          - **Framework:** Express 4.x
          - **Database:** PostgreSQL
          - **Auth:** JWT + Google OAuth 2.0
          - **Deployment:** Render.com (backend) + Vercel (frontend)

          ---

          ## Known Critical Issues (from Static Review)

          | # | ID | Severity | Description | File |
          |---|---|---|---|---|
          | 1 | CRIT-01 | 🔴 CRITICAL | Hardcoded default JWT secret fallback | `src/config/jwt.js:4` |
          | 2 | CRIT-02 | 🔴 CRITICAL | Real .env with secrets may be in git history | `backend/.env` |
          | 3 | CRIT-03 | 🔴 CRITICAL | Google Client ID hardcoded in render.yaml | `render.yaml:30` |
          | 4 | HIGH-01  | 🟠 HIGH | Weak JWT secret (30-char, guessable) | `backend/.env:7` |
          | 5 | HIGH-02  | 🟠 HIGH | Uploads served without authentication | `src/app.js:69` |
          | 6 | HIGH-03  | 🟠 HIGH | Dev rate-limiter reset endpoint on public API | `src/routes/auth.js:51` |
          | 7 | HIGH-04  | 🟠 HIGH | CORS allows all origins in non-production | `src/app.js:44` |
          | 8 | HIGH-05  | 🟠 HIGH | Image URL cross-user association risk | `src/routes/scan.js:77` |
          | 9 | HIGH-06  | 🟠 HIGH | SSL rejectUnauthorized disabled for DB | `src/config/db.js:30` |
          | 10| HIGH-07  | 🟠 HIGH | Email TLS rejectUnauthorized disabled | `src/services/mailerService.js:24` |

          ---

          ## Policy

          > 🚦 **Pipeline fails ONLY on CRITICAL severity findings.**
          > HIGH and MEDIUM findings are reported as warnings.
          > Review all artifacts uploaded for full details.

          ---

          ## Artifacts Available

          - `gitleaks-report` — SARIF from Gitleaks secret scan
          - `semgrep-report` — SARIF + JSON from Semgrep SAST
          - `trivy-reports` — SARIF + JSON from Trivy CVE scan
          - `npm-audit-report` — JSON from npm audit

          ---

          **Triggered by:** `${{ github.actor }}` | **Branch:** `${{ github.ref_name }}` | **Commit:** `${{ github.sha }}`
          DETAILS

      - name: Fail pipeline if any CRITICAL tool failed
        if: |
          needs.gitleaks.result == 'failure' ||
          needs.trivy.result == 'failure' ||
          needs.npm-audit.result == 'failure'
        run: |
          echo "::error::🚨 Security pipeline FAILED — CRITICAL vulnerabilities detected. Review the summary and artifacts above."
          exit 1
