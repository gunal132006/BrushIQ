name: BrushIQ Appium Automation Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test Suite to Execute (smoke / regression / all)'
        required: true
        default: 'smoke'

jobs:
  appium-android-tests:
    runs-on: macos-13

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium -v

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Start Appium Server
        run: |
          appium --log appium-server.log &
          sleep 5

      - name: Run Android Emulator and Execute Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Pixel_7
          script: |
            adb devices
            cd appium-tests
            chmod +x ../android/gradlew
            ../android/gradlew test -Dsuite=${{ github.event.inputs.test_suite || 'smoke' }} -Dandroid.app.path=../android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Extent Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: appium-tests/reports/

      - name: Upload Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: appium-tests/screenshots/
