name: Selenium End-to-End Test Automation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-e2e:
    name: Run Selenium Web E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Google Chrome (Headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Selenium Test Dependencies
        run: |
          if [ -d "selenium-tests" ]; then
            cd selenium-tests && npm install || true
          fi

      - name: Run Backend API in Background for E2E Testing
        run: |
          cd backend
          npm install
          npm start &
          sleep 5

      - name: Execute Selenium E2E Test Suite
        run: |
          if [ -d "selenium-tests" ]; then
            cd selenium-tests
            npm test || true
          fi

      - name: Generate Selenium Excel & Execution Summary Reports
        run: |
          if [ -f "selenium-tests/generate-report.js" ]; then
            node selenium-tests/generate-report.js || true
          fi

      - name: Upload Selenium Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-test-reports
          path: |
            selenium-tests/reports/
            selenium-summary.xlsx
            selenium-test-cases.xlsx
            *.png
